# Standalone benchmark configuration; paths are relative to the project root.
# Every model/training option is explicit; experiments may override these values.
benchmark: bench4
data:
  kind: maze
  loader:
    data_path: ../data/maze_data.npz
    cut_start: 30
    behavior_dims: 2
    device: null
  shuffle_trials: true
  shuffle_seed: null
  normalization: zscore
masking:
  threshold: 0
model:
  z_dim: 64
  Cmax: 182
  attn_dim: 4
  behavior_dim: 2
  hidden_dim: 256
  num_post_layers: 0
  num_conditions: 35
  tf: 1
  warmup_steps: 5
  sampling_rate: 500
  LoRA_rank: 5
  input_time: 0
  beh_delay: 5
  attn_nonlinear: none
  y_nonlinear: softplus
  beh_nonlinear: tanh
  session_variability: false
  dyn_loss_weight: 0.01
  recon_loss_weight: 0.01
  pred_loss_weight: 1
  beh_weight: 0
  criterion_mode: L1
  masked_attention: true
  use_pos_emb: true
training:
  epochs: 200
  augment: true
  n_aug: 1
  earlystop_epochs: 50
  test_size: 0.2
  val_size: 0.2
  random_state: seed
  num_workers: 0
  batch_size: 50
  shuffle_train: true
  shuffle_eval: true
  earlystop_patience: 50
  earlystop_delta: 0
  earlystop_verbose: true
  grad_clip_norm: 1.0
  eval_interval: 50
  mask_ratio: 0.2
  mask_ratio_range:
  - 0.3
  - 0.7
  augmentation_rounding: round
optimizer:
  name: AdamW
  kwargs:
    lr: 0.001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.01
    amsgrad: false
    maximize: false
    foreach: null
    capturable: false
    differentiable: false
    fused: null
runtime:
  devices:
  - cuda:0
  - cuda:1
  - cuda:2
  - cuda:3
  seeds:
  - 0
  - 1
  - 2
  mask_ratios:
  - 0.1
  - 0.2
  - 0.3
  - 0.4
  parallel: true
  max_workers: 1
  start_method: spawn
  skip_completed: true
  max_task_retries: 2
  worker_start_delay_seconds: 2
  stagger_workers: 2
  retry_backoff_base: 2
evaluation:
  teacher_forcing:
  - name: tf_ori
    tf: null
  - name: tf_pos1
    tf: 1
  latent_regression: false
  decode_observations: true
  decode_latents: true
outputs:
  checkpoint: checkpoints/baselinecomp/bench4_no_beh_weight/{exp_name}_{mask_ratio}/seed_{seed}.pth
  metrics_csv: metrics/baselinecomp/bench4_no_beh_weight_results.csv
experiments:
- name: CHAMA_LoRA
  model: {}
  training: {}
